name: Build and Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: "sing-box version (WARNING: >=1.12 doubles image size)"
        default: "1.9.5"
      cloudflared_version:
        description: "cloudflared version tag, or 'auto' for latest"
        default: "auto"
  schedule:
    # every Tuesday 02:00 Beijing time -- refresh cloudflared, rebuild
    - cron: "0 18 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [direct, argo]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: ver
        run: |
          SB="${{ github.event.inputs.sing_box_version }}"
          CF="${{ github.event.inputs.cloudflared_version }}"
          [ -z "$SB" ] && SB="1.9.5"
          [ -z "$CF" ] && CF="auto"
          if [ "$CF" = "auto" ]; then
            CF=$(curl -fsSL https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name')
          fi
          echo "sb=$SB" >> "$GITHUB_OUTPUT"
          echo "cf=$CF" >> "$GITHUB_OUTPUT"
          echo "sing-box: $SB  cloudflared: $CF"

      - name: Lowercase image name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker tags
        id: tags
        run: |
          R="ghcr.io/${{ steps.repo.outputs.name }}"
          T="${{ matrix.target }}"
          V="sb${{ steps.ver.outputs.sb }}-cf${{ steps.ver.outputs.cf }}"
          TAGS="$R:$T,$R:$V-$T"
          if [ "$T" = "direct" ]; then TAGS="$TAGS,$R:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SING_BOX_VERSION=${{ steps.ver.outputs.sb }}
            CLOUDFLARED_VERSION=${{ steps.ver.outputs.cf }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
